<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header" data-pptx-bounds="64 44 1152 92">
    <text x="64" y="68" font-size="16" font-weight="bold" fill="#1C9C8C">02 方案设计</text>
    <text x="64" y="112" font-size="32" font-weight="bold" fill="#1F4E79">排除标准：三条最易漏的重点</text>
    <rect x="64" y="126" width="48" height="4" fill="#1C9C8C"/>
  </g>
  <g id="key-exclusions" data-pptx-bounds="64 152 400 516" fill="#1D2430">
    <rect x="64" y="156" width="400" height="508" fill="#E0A030" fill-opacity="0.12"/>
    <rect x="64" y="156" width="6" height="508" fill="#E0A030"/>
    <use data-icon="tabler-filled/alert-triangle" x="94" y="178" width="32" height="32" fill="#E0A030"/>
    <text x="136" y="204" font-size="24" font-weight="bold" fill="#1D2430">筛选时重点核查</text>
    <text x="94" y="276" font-size="26" font-weight="bold" fill="#B07A10">①</text>
    <text x="134" y="276" font-size="24" font-weight="bold">既往或目前有<tspan x="134" dy="34">胰腺炎病史</tspan></text>
    <text x="94" y="398" font-size="26" font-weight="bold" fill="#B07A10">②</text>
    <text x="134" y="398" font-size="24" font-weight="bold">正在或入组前3个月内<tspan x="134" dy="34">使用其他GLP-1R/GIPR</tspan><tspan x="134" dy="34">激动剂</tspan></text>
    <text x="94" y="554" font-size="26" font-weight="bold" fill="#B07A10">③</text>
    <text x="134" y="554" font-size="24" font-weight="bold">近3个月内发生<tspan x="134" dy="34">ILD急性加重</tspan></text>
  </g>
  <g id="excl-ild" data-pptx-bounds="496 156 720 176" font-size="22" fill="#1D2430">
    <text x="496" y="190" font-weight="bold" fill="#1F4E79">ILD相关</text>
    <text x="640" y="190">· 药物毒性、感染等非CTD原因可解释的ILD</text>
    <text x="640" y="222">· HRCT以磨玻璃影为主且超过网状影</text>
    <text x="640" y="254">· 合并临床显著的COPD或支气管哮喘</text>
    <text x="640" y="286">· 近3个月针对肺部调整激素（&gt;10 mg/d）、<tspan x="640" dy="32">　免疫抑制剂或细胞因子调节剂</tspan></text>
  </g>
  <g id="excl-metabolic" data-pptx-bounds="496 336 720 56" font-size="22" fill="#1D2430">
    <rect x="496" y="340" width="720" height="1" fill="#D5DCE4"/>
    <text x="496" y="374" font-weight="bold" fill="#1F4E79">代谢/药物</text>
    <text x="640" y="374">· 1型糖尿病；对替尔泊肽或其辅料过敏</text>
  </g>
  <g id="excl-comorbid" data-pptx-bounds="496 396 720 116" font-size="22" fill="#1D2430">
    <rect x="496" y="400" width="720" height="1" fill="#D5DCE4"/>
    <text x="496" y="434" font-weight="bold" fill="#1F4E79">合并症</text>
    <text x="640" y="434">· NYHA III–IV级心衰、活动性恶性肿瘤</text>
    <text x="640" y="466">· eGFR&lt;30 mL/min、严重肝功能损害</text>
    <text x="640" y="498">· 活动性感染、HIV或病毒性肝炎</text>
  </g>
  <g id="excl-other" data-pptx-bounds="496 516 720 116" font-size="22" fill="#1D2430">
    <rect x="496" y="520" width="720" height="1" fill="#D5DCE4"/>
    <text x="496" y="554" font-weight="bold" fill="#1F4E79">其他</text>
    <text x="640" y="554">· 妊娠、哺乳或研究期间计划妊娠</text>
    <text x="640" y="586">· 正在参加其他干预性临床研究</text>
    <text x="640" y="618">· 研究者判断不适宜入组的其他情况</text>
  </g>
  <g id="excl-note" data-pptx-bounds="496 636 720 32">
    <text x="496" y="660" font-size="16" fill="#5B6878">共14条，完整条款见方案4.1.3节</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 684 1152 30" font-size="16" fill="#5B6878">
