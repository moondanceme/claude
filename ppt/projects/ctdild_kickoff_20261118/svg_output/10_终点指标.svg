    <text x="64" y="112" font-size="32" font-weight="bold" fill="#1F4E79">终点指标：FVC绝对变化是唯一主要终点</text>
    <rect x="64" y="126" width="48" height="4" fill="#1C9C8C"/>
  </g>
  <g id="primary-endpoint" data-pptx-bounds="64 152 400 416">
