    <text x="856" y="324">6　HbA1c</text>
  </g>
  <g id="exploratory-endpoints" data-pptx-bounds="496 360 720 208" font-size="22" fill="#1D2430">
    <text x="496" y="396" font-size="24" font-weight="bold" fill="#1C9C8C">探索性终点</text>
    <rect x="496" y="412" width="720" height="1" fill="#D5DCE4"/>
    <text x="496" y="452">1　胸部HRCT纤维化范围变化</text>
    <text x="496" y="492">2　血清纤维化生物标志物变化</text>
    <text x="496" y="532">3　26周内疾病进展事件发生率</text>
    <text x="856" y="452">4　BALF细胞学及促纤维化<tspan x="856" dy="32">　　巨噬细胞标志物变化</tspan></text>
  </g>
  <g id="analysis-band" data-pptx-bounds="64 580 1152 88">
    <rect x="64" y="584" width="1152" height="80" fill="#F2F5F8"/>
    <text x="88" y="616" font-size="18" fill="#1D2430"><tspan font-weight="bold" fill="#1F4E79">统计分析：</tspan>ITT为主要分析集；主要终点用ANCOVA（协变量：基线FVC、HRCT纤维化模式），<tspan x="88" dy="30">报告调整后均值差及95%CI与Cohen's d；敏感性分析含MMRM、Wilcoxon检验与PPS；所有P值按描述性解读</tspan></text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 684 1152 30" font-size="16" fill="#5B6878">
