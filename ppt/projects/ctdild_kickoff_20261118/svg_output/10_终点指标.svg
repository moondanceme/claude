    <text x="96" y="204" font-size="18" font-weight="bold" fill="#E0A030">主要终点</text>
    <text x="96" y="300" font-size="52" font-weight="bold" fill="#FFFFFF">FVC</text>
    <text x="96" y="356" font-size="26" fill="#FFFFFF">第26周较基线的<tspan x="96" dy="38" font-weight="bold">绝对变化量（mL）</tspan></text>
    <text x="96" y="480" font-size="16" fill="#D5DCE4">选用绝对值而非%pred：减少小样本中<tspan x="96" dy="26">预计值公式带来的个体间变异</tspan></text>
  </g>
  <g id="secondary-endpoints" data-pptx-bounds="496 152 720 196" font-size="22" fill="#1D2430">
    <text x="496" y="188" font-size="24" font-weight="bold" fill="#1F4E79">次要终点<tspan font-size="24" font-weight="normal" fill="#5B6878">（第26周较基线变化）</tspan></text>
    <rect x="496" y="204" width="720" height="1" fill="#D5DCE4"/>
    <text x="496" y="244">1　FVC%pred</text>
    <text x="496" y="284">2　DLCO%pred</text>
    <text x="496" y="324">3　6分钟步行距离（6MWD）</text>
    <text x="856" y="244">4　K-BILD总分</text>
