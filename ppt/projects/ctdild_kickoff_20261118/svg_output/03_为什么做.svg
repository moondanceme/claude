<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header" data-pptx-bounds="64 44 1152 92">
    <text x="64" y="68" font-size="16" font-weight="bold" fill="#1C9C8C">01 为什么做</text>
    <text x="64" y="112" font-size="32" font-weight="bold" fill="#1F4E79">为什么做：替尔泊肽的潜能</text>
    <rect x="64" y="126" width="48" height="4" fill="#1C9C8C"/>
  </g>
  <g id="need-column" data-pptx-bounds="64 152 328 388" fill="#1D2430" font-size="22">
    <rect x="64" y="156" width="320" height="380" fill="#F2F5F8"/>
    <text x="88" y="196" font-size="24" font-weight="bold" fill="#1F4E79">未满足的需求</text>
    <text x="88" y="240">现有药物仅能延缓、<tspan x="88" dy="32">不能逆转纤维化</tspan></text>
    <text x="88" y="320">代谢异常推动纤维化：<tspan x="88" dy="32">肥胖、胰岛素抵抗、</tspan><tspan x="88" dy="32">高血糖经炎症、氧化</tspan><tspan x="88" dy="32">应激与成纤维细胞活</tspan><tspan x="88" dy="32">化相互驱动</tspan></text>
    <text x="88" y="496">尚无药物获批用于<tspan x="88" dy="32">CTD-ILD整体治疗</tspan></text>
  </g>
  <g id="evidence-1" data-pptx-bounds="412 152 804 124" fill="#1D2430">
    <use data-icon="tabler-filled/flask" x="416" y="164" width="32" height="32" fill="#1C9C8C"/>
    <text x="458" y="190" font-size="24" font-weight="bold" fill="#1F4E79">多器官抗纤维化</text>
    <text x="656" y="190" font-size="22">GLP-1类药物抑制TGF-β/Smad、激活AMPK；<tspan x="656" dy="32">替尔泊肽2期试验对F2–F3期MASH显著有效，</tspan><tspan x="656" dy="32">2026年1月获NMPA突破性治疗品种认定</tspan></text>
    <rect x="416" y="272" width="800" height="1" fill="#D5DCE4"/>
  </g>
  <g id="evidence-2" data-pptx-bounds="412 280 804 148" fill="#1D2430">
    <use data-icon="tabler-filled/lungs" x="416" y="290" width="32" height="32" fill="#1C9C8C"/>
    <text x="458" y="316" font-size="24" font-weight="bold" fill="#1F4E79">肺部临床线索</text>
    <text x="656" y="316" font-size="22">IPF队列（倾向评分匹配，各1166例）：<tspan x="656" dy="32">GLP-1RA使3年死亡风险降低<tspan font-weight="bold" fill="#1F4E79">约38%</tspan></tspan><tspan x="656" dy="32">pSS-ILD个案：联合司美格鲁肽约1年，</tspan><tspan x="656" dy="32">FVC从<tspan font-weight="bold" fill="#1F4E79">68%升至99% pred</tspan></tspan></text>
    <rect x="416" y="424" width="800" height="1" fill="#D5DCE4"/>
  </g>
  <g id="evidence-3" data-pptx-bounds="412 432 804 108" fill="#1D2430">
    <use data-icon="tabler-filled/microscope" x="416" y="442" width="32" height="32" fill="#1C9C8C"/>
    <text x="458" y="468" font-size="24" font-weight="bold" fill="#1F4E79">本组前期数据</text>
    <text x="656" y="468" font-size="22">博来霉素小鼠模型：替尔泊肽显著减轻<tspan x="656" dy="32">肺纤维化，并调控促纤维化巨噬细胞亚群</tspan><tspan x="656" dy="32" fill="#5B6878">（未发表数据）</tspan></text>
  </g>
  <g id="hypothesis-band" data-pptx-bounds="64 552 1152 116">
    <rect x="64" y="556" width="1152" height="108" fill="#1F4E79" fill-opacity="0.08"/>
    <rect x="64" y="556" width="6" height="108" fill="#1F4E79"/>
    <text x="96" y="600" font-size="24" font-weight="bold" fill="#1F4E79">假设：替尔泊肽满足降糖/减重刚需，同时可能带来抗纤维化附加获益</text>
    <text x="96" y="638" font-size="18" fill="#1D2430">定位：探索性先导研究——为后续确证性试验提供效应量估计与设计参数</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 684 1152 30" font-size="16" fill="#5B6878">
    <rect x="64" y="686" width="1152" height="1" fill="#D5DCE4"/>
    <text x="64" y="707">替尔泊肽 CTD-ILD 先导RCT · 项目启动会</text>
    <text x="1216" y="707" text-anchor="end">03</text>
  </g>
